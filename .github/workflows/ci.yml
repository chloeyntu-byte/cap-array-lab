name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.8'
            os: ubuntu-22.04
          - python: '3.12'
            os: ubuntu-latest
          - python: '3.13'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install a virtual display for Tk tests
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install Python packages (Z11 Studio)
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-z11.txt
      - name: Cap Array Lab and Z11 tests
        run: xvfb-run -a python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Synthetic examples rebuild
        run: |
          cp -r examples "$RUNNER_TEMP/examples-committed"
          python -B -m caplab.demo
          python scripts/compare_numeric_tree.py "$RUNNER_TEMP/examples-committed" examples
